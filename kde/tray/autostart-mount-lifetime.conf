[Service]
# The tray supervises in-flight launchers. A completed mount has its own
# FUSE daemon and must stay available when Plasma restarts the tray.
KillMode=process
# Track the tray itself so a surviving FUSE daemon does not keep a dead
# tray service active. On restart the tray reconciles the live mounts.
ExitType=main
